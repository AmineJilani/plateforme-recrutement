<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #7d3cff;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px 8px 0 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h2>Créer un compte</h2>
        </div>
        <br>
        <form onsubmit="return verifierMotDePasse()">
            <div class="mb-3">
                <label class="form-label">Civilité</label>
                <div class="form-check form-check-inline">
                    <input type="radio" name="civilite" id="monsieur" class="form-check-input" required>
                    <label for="monsieur" class="form-check-label">Monsieur</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="civilite" id="madame" class="form-check-input">
                    <label for="madame" class="form-check-label">Madame</label>
                </div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Mail</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" required>
            </div>
            <div class="mb-3">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="prenom" required>
            </div>
            <div class="mb-3">
                <label for="telephone" class="form-label">Téléphone</label>
                <input type="tel" class="form-control" id="telephone" pattern="[0-9]{10}" placeholder="Format : 0612345678" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" required>
                <small class="text-muted">Votre mot de passe doit contenir au moins 12 caractères, incluant majuscules, minuscules, chiffres et caractères spéciaux.</small>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirmation du mot de passe</label>
                <input type="password" class="form-control" id="confirm-password" required>
                <div id="error-message" class="text-danger" style="display: none;">Les mots de passe ne correspondent pas.</div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label for="terms" class="form-check-label">J'accepte les <a href="#">conditions d'utilisation</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Créer</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
