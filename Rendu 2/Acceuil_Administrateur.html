<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #7d3cff;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
        }
        .header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .filter-section {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
        }
        .offer-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-purple {
            background-color: #7d3cff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .offer-logo {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            margin-right: 15px;
        }
        .status-actif {
            color: green;
        }
        .status-expire {
            color: red;
        }
        .filter-buttons button {
            margin: 5px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #6c757d;
            color: white;
            cursor: pointer;
        }
        .filter-buttons button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="./icone.png" alt="Recruteur">
        <div>
            <h4>Alexandre Lagranve</h4>
            <p class="m-0">Administrateur</p>
        </div>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="filter-section">
                    <h5>Gestionnaire</h5>
                    <div class="filter-buttons">
                        <button>Utilisateur</button>
                        <button>Organisations</button>
                        <button>Recruteurs</button>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <input type="text" class="form-control mb-3" placeholder="Rechercher">
                
                <div class="offer-card">
                    <div class="d-flex align-items-center">
                        <img src="./icone.png" alt="Alice" class="offer-logo">
                        <div>
                            <h6>Alice Marchand</h6>
                            <p class="text-muted">Chercheuse d'emploi - Commerce</p>
                        </div>
                    </div>
                    <button class="btn btn-outline-secondary">Gérer</button>
                </div>
                
                <div class="offer-card">
                    <div class="d-flex align-items-center">
                        <img src="./logo-Safran.jpg" alt="Safran" class="offer-logo">
                        <div>
                            <h6>Safran</h6>
                            <p class="text-muted">Entreprise aéronautique</p>
                        </div>
                    </div>
                    <div class="d-flex flex-column align-items-end">
                        <p style="text-align: center; margin-bottom: 5px;">Demande d'enregistrement</p>
                        <div class="d-flex justify-content-end">
                            <button class="btn p-0">
                                <img src="./Check-Logo.png" height="30" alt="Accepter">
                            </button>
                            <button class="btn p-0 ms-2">
                                <img src="./logo-refus.jpg" height="40" alt="Refuser">
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="offer-card">
                    <div class="d-flex align-items-center">
                        <img src="./icone.png" alt="icone" class="offer-logo">
                        <div>
                            <h6>Benoit Leboisier</h6>
                            <p class="text-muted">Recruteur chez Safran</p>
                        </div>
                    </div>
                    <div class="d-flex flex-column align-items-end">
                        <p style="text-align: center; margin-bottom: 5px;">Demande de rejoindre Safran en tant que recruteur</p>
                        <div class="d-flex justify-content-end">
                            <button class="btn p-0">
                                <img src="./Check-Logo.png" height="30" alt="Accepter">
                            </button>
                            <button class="btn p-0 ms-2">
                                <img src="./logo-refus.jpg" height="40" alt="Refuser">
                            </button>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
