<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #7d3cff;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            text-align: left;
        }
        .header img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }
        .filter-section {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
        }
        .job-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-purple {
            background-color: #7d3cff;
            color: white;
            border: none;
        }
        .job-logo {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="./icone.png" alt="Recruteur">
        <div>
            <h4>Julien Alvarez</h4>
            <p class="m-0">Candidat</p>
        </div>
    </div>

    <div class="container mt-3">
        <div class="row">
            <div class="col-md-3">
                <div class="filter-section">
                    <h5>Filtrer</h5>
                    <label class="form-label">Distance</label>
                    <div class="d-flex align-items-center">
                        <input type="range" class="form-range me-2" min="1" max="50" value="17" id="distanceRange">
                        <span id="distanceValue">17 km</span>
                    </div>
                
                    <h6 class="mt-2">Secteur d'activité</h6>
                    <div>
                        <input type="checkbox" id="ingenierie"> <label for="ingenierie">Ingénierie</label><br>
                        <input type="checkbox" id="commercial"> <label for="commercial">Commercial</label><br>
                        <input type="checkbox" id="autres"> <label for="autres">Etc.</label>
                    </div>
                
                    <h6 class="mt-2">Type de contrat</h6>
                    <div>
                        <input type="checkbox" id="cdd"> <label for="cdd">CDD</label><br>
                        <input type="checkbox" id="cdi"> <label for="cdi">CDI</label>
                    </div>
                
                    <h6 class="mt-2">Mode de travail</h6>
                    <div>
                        <input type="checkbox" id="presentiel"> <label for="presentiel">Présentiel</label><br>
                        <input type="checkbox" id="teletravail"> <label for="teletravail">Télétravail</label><br>
                        <input type="checkbox" id="hybride"> <label for="hybride">Hybride</label>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <input type="text" class="form-control mb-3" placeholder="Rechercher des offres d'emplois">
                
                <div class="job-card">
                    <div class="d-flex align-items-center">
                        <img src="./logo-Safran.jpg" alt="UltraBuild Logo" class="job-logo">
                        <div>
                            <h6>Safran</h6>
                            <p>Directeur des travaux</p>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-outline-secondary">Détails</button>
                        <button class="btn btn-purple">Candidater</button>
                    </div>
                </div>
                
                <div class="job-card">
                    <div class="d-flex align-items-center">
                        <img src="./logo-phoenix-black-transp-500px.png" alt="Phoenix Motors Logo" class="job-logo">
                        <div>
                            <h6>Phoenix Motors</h6>
                            <p>Ressources Humaines</p>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-outline-secondary">Détails</button>
                        <button class="btn btn-purple">Candidater</button>
                    </div>
                </div>
                <div class="job-card">
                    <div class="d-flex align-items-center">
                        <img src="./téléchargement.png" alt="Phoenix Motors Logo" class="job-logo">
                        <div>
                            <h6>Louis Vuitton</h6>
                            <p>Responsable de production</p>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-outline-secondary">Détails</button>
                        <button class="btn btn-purple">Candidater</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
