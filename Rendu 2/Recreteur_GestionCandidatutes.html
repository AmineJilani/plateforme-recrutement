<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Candidatures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #7d3cff;
            color: white;
            padding: 15px;
            text-align: left;
            display: flex;
            align-items: center;
        }
        .header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .filter-section {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
        }
        .filter-section img {
            display: block;
            width: 80px;
            height: auto;
            margin: 0 auto 10px;
            border-radius: 5px;
        }   

        .offer-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-purple {
            background-color: #7d3cff;
            color: white;
            border: none;
        }
        .offer-logo {
            width: 40px;
            height: 40px;
            margin-right: 10px;
        }
        .status-retenue {
            color: green;
        }
        .status-nonretene {
            color: red;
        }
        .status-attente {
            color: orange;
        }
    </style>
</head>
<body>
    <div class="header d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <img src="./icone.png" alt="Recruteur">
            <div>
                <h4>Alexandre Garild</h4>
                <p class="m-0">Recruteur</p>
            </div>
        </div>
        <div class="mx-auto text-center">
            <h4>Gestion des Candidatures</h4>
        </div>
    </div>

    <div class="container mt-3">
        <div class="row">
            <div class="col-md-3">
                <div class="filter-section">
                    <div class="d-flex align-items-center">
                        <img src="./logo-phoenix-black-transp-500px.png" alt="logo" class="mr-3">
                        <div>
                            <h6>Phoenix Motors</h6>
                        </div>
                    </div>
                    <div class="d-flex align-items-center">
                        <div>
                            <h5>Ingénieur DevOps</h5>
                        </div>
                    </div>
                    <br>
                    <h5>Filtrer</h5>
                    <label class="form-label">Date de Candidature</label>
                    <input type="date" class="form-control">
                    <h6 class="mt-2">État de la candidature</h6>
                    <div>
                        <input type="checkbox" id="Retenue"> <label for="Retenue">Retenue</label><br>
                        <input type="checkbox" id="Attente"> <label for="Attente">En attente</label><br>
                        <input type="checkbox" id="NonRetenue"> <label for="NonRetenue">Non retenue</label>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <input type="text" class="form-control mb-3" placeholder="Rechercher">

                <div class="offer-card">
                    <div class="d-flex align-items-center">
                        <div>
                            <h6>Alice Marchand</h6>
                            <p>Date de candidature : 02/01/2025</p>
                        </div>
                    </div>
                    <div>
                        <span class="status-attente" >En attente</span> <!-- Placer "En attente" au-dessus des boutons -->
                        <div class="d-flex mt-2">
                            <button class="btn btn-outline-secondary mr-2">Contacter</button>
                            <button class="btn btn-outline-secondary">Télécharger Dossier</button>
                        </div>
                    </div>
                </div>

                <div class="offer-card">
                    <div class="d-flex align-items-center">
                        <div>
                            <h6>Jean Dupont</h6> 
                            <p>Date de candidature : 15/02/2025</p>
                        </div>
                    </div>
                    <div>
                        <span class="status-retenue" >Non retenue</span> 
                        <div class="d-flex mt-2">
                            <button class="btn btn-outline-secondary mr-2">Contacter</button>
                            <button class="btn btn-outline-secondary">Télécharger Dossier</button>
                        </div>
                    </div>
                </div>

                <div class="offer-card">
                    <div class="d-flex align-items-center">
                        <div>
                            <h6>Léo Trincao</h6> 
                            <p>Date de candidature : 2/02/2025</p>
                        </div>
                    </div>
                    <div>
                        <span class="status-nonretene" >Retenue</span>
                        <div class="d-flex mt-2">
                            <button class="btn btn-outline-secondary mr-2">Contacter</button>
                            <button class="btn btn-outline-secondary">Télécharger Dossier</button>
                        </div>
                    </div>
                </div>
                
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
